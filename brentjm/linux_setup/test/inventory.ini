# Test inventory: the Vagrant VM stands in for every group.
# Run from brentjm/linux_setup:  ansible-playbook -i test/inventory.ini playbooks/<name>.yml
[trading]
testbox username=vagrant  # host var: beats group_vars/all.yml

[workstations]
testbox

[home_servers]
testbox

[all:vars]
ansible_host=127.0.0.1
ansible_port=2299
ansible_user=vagrant
ansible_ssh_private_key_file={{ inventory_dir }}/.vagrant/machines/testbox/virtualbox/private_key
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
