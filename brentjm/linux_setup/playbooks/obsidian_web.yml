---
# Obsidian in a browser on odin, reachable over Tailscale only (install Tailscale first: playbooks/server.yml --tags tailscale). Run one role with --tags <role>.
- name: Obsidian web (phone view of the vault)
  hosts: home_servers
  gather_facts: true
  roles:
    - { role: docker, tags: docker }
    - { role: obsidian_web, tags: obsidian_web }
