---
# Run one workstation task file by itself. Change tasks_from as needed.
# (Tags usually do this more simply: workstation.yml --tags signal)
- name: Debug tasks
  hosts: home_servers
  gather_facts: true
  tasks:
    - name: Run one task file from the workstation role
      ansible.builtin.include_role:
        name: workstation
        tasks_from: signal.yml
