# Groups keep each playbook on the right machine.
# frigg is the dedicated trading box: only trading_server.yml targets it.

[trading]
frigg ansible_host=192.168.68.55 ansible_user=brent ansible_ssh_private_key_file=/home/brent/.ssh/id_ed25519

[workstations]
odin ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[home_servers]
odin ansible_connection=local ansible_python_interpreter=/usr/bin/python3
