# Groups keep each playbook on the right machine.
# frigg is the dedicated trading box: only trading_server.yml targets it.

[trading]
# ansible_become_exe: Ubuntu 26.04 defaults to sudo-rs, which hangs Ansible's password prompt
# (Launchpad bug 2122414). Classic sudo is still installed as sudo.ws.
frigg ansible_host=192.168.68.61 ansible_user=brent ansible_ssh_private_key_file=/home/brent/.ssh/id_ed25519 ansible_become_exe=sudo.ws

[workstations]
odin ansible_connection=local ansible_python_interpreter=/usr/bin/python3 ansible_become_exe=sudo.ws

[home_servers]
odin ansible_connection=local ansible_python_interpreter=/usr/bin/python3 ansible_become_exe=sudo.ws
