---
- name: Allow SSH port
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Allow TWS ports from Docker network
  community.general.ufw:
    rule: allow
    port: 7496:7497
    proto: tcp
    src: 172.16.0.0/12  # Docker private range; 172.0.0.0/8 included public addresses

- name: Enable UFW
  community.general.ufw:
    state: enabled
