---
# Each step has a tag: run one with --tags <tag>, skip with --skip-tags <tag>.
- name: Install apt packages
  ansible.builtin.import_tasks: apt.yml
  tags: apt

- name: Create directory for AppImages
  ansible.builtin.import_tasks: appimage.yml
  tags: appimage

- name: Install snaps
  ansible.builtin.import_tasks: snaps.yml
  tags: snaps

- name: Install Node.js
  ansible.builtin.import_tasks: nodejs.yml
  tags: nodejs

- name: Install global Node.js tools
  ansible.builtin.import_tasks: nodejs_global_tools.yml
  tags: nodejs

- name: Install Neovim
  ansible.builtin.import_tasks: neovim.yml
  tags: neovim

- name: Install Go
  ansible.builtin.import_tasks: go.yml
  tags: go

- name: Install C# .NET
  ansible.builtin.import_tasks: csharp.yml
  tags: csharp

- name: Install Conda
  ansible.builtin.import_tasks: conda.yml
  tags: conda

- name: Install LaTeX
  ansible.builtin.import_tasks: latex.yml
  tags: latex

- name: Install lazygit
  ansible.builtin.import_tasks: lazygit.yml
  tags: lazygit

- name: Install Nerd Fonts
  ansible.builtin.import_tasks: nerdfonts.yml
  tags: nerdfonts

- name: Set up bash
  ansible.builtin.import_tasks: bash.yml
  tags: bash

- name: Install Dropbox
  ansible.builtin.import_tasks: dropbox.yml
  tags: dropbox

- name: Install KeePassXC
  ansible.builtin.import_tasks: keepassxc.yml
  tags: keepassxc

- name: Install IBKR Trader Workstation
  ansible.builtin.import_tasks: ibkr_tws.yml
  tags: ibkr_tws

- name: Install Signal Desktop
  ansible.builtin.import_tasks: signal.yml
  tags: signal
