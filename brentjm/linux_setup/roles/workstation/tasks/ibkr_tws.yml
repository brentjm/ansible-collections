---
- name: Download Trader Workstation installer
  ansible.builtin.get_url:
    url: "{{ ibkr_tws_download_url }}"
    dest: "/tmp/tws-latest-linux-x64.sh"
    mode: '0755'

- name: Make installer executable
  ansible.builtin.file:
    path: "/tmp/tws-latest-linux-x64.sh"
    mode: '0755'

- name: Run Trader Workstation installer
  ansible.builtin.command:
    cmd: "./tws-latest-linux-x64.sh -q"  # -q: unattended; without it the installer waits for input
    chdir: /tmp
  become: false
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/Jts"
