---
# https://www.anaconda.com/docs/getting-started/miniconda/install#quickstart-install-instructions
- name: Create Miniconda installation directory
  ansible.builtin.file:
    path: /home/{{ username }}/miniconda3
    state: directory
    mode: '0755'

# No fixed checksum: the "latest" installer changes with each Miniconda release,
# so a pinned hash fails. Pin a versioned URL plus its hash if verification is wanted.
- name: Check whether conda is installed
  ansible.builtin.stat:
    path: /home/{{ username }}/miniconda3/bin/conda
  register: conda_bin

- name: Download Miniconda installer
  ansible.builtin.get_url:
    url: "{{ miniconda_download_url }}"
    dest: /home/{{ username }}/miniconda3/miniconda.sh
    mode: '0755'
  when: not conda_bin.stat.exists

- name: Install Miniconda
  ansible.builtin.command:
    cmd: bash /home/{{ username }}/miniconda3/miniconda.sh -b -u -p /home/{{ username }}/miniconda3
    creates: /home/{{ username }}/miniconda3/bin/conda

- name: Remove Miniconda installer
  ansible.builtin.file:
    path: /home/{{ username }}/miniconda3/miniconda.sh
    state: absent

