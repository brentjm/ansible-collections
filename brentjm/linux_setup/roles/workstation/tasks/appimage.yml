---
- name: Install libfuse2 for AppImages # https://github.com/AppImage/AppImageKit/wiki/FUSE
  ansible.builtin.apt:
    name: libfuse2t64
    state: present
  become: true

- name: Create AppImage directory
  ansible.builtin.file:
    path: /home/{{ username }}/bin
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0755'

# lineinfile is idempotent; it reads the target's .bashrc (a file lookup would read the control node's)
- name: Add ~/bin to PATH
  ansible.builtin.lineinfile:
    path: /home/{{ username }}/.bashrc
    line: 'export PATH="$HOME/bin:$PATH"'
