---
# General desktop setup that is not one application: basic packages, AppImage
# support and bash settings.
- name: Install basic packages
  ansible.builtin.apt:
    name: "{{ desktop_base_packages }}"
    state: present
  become: true

- name: Install libfuse2 for AppImages # https://github.com/AppImage/AppImageKit/wiki/FUSE
  ansible.builtin.apt:
    name: libfuse2t64
    state: present
  become: true

- name: Create AppImage directory
  ansible.builtin.file:
    path: /home/{{ username }}/bin
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0755'

# lineinfile adds each line only if missing; it reads the target's .bashrc
# (a file lookup would read the control node's)
- name: Add bash settings
  ansible.builtin.lineinfile:
    path: /home/{{ username }}/.bashrc
    line: "{{ item }}"
  loop:
    - set -o vi
    - export FCEDIT=vi
    - 'export PATH="$HOME/.local/bin:$PATH"'
    - 'export PATH="$HOME/bin:$PATH"'
