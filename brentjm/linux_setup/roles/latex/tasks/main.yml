---
- name: Install LaTeX packages
  ansible.builtin.apt:
    name:
      - texlive
      - texlive-latex-base
      - texlive-latex-recommended
      - texlive-latex-extra
      - texlive-fonts-recommended
      - texlive-fonts-extra
      - texlive-lang-english
      - texlive-science
      - texlive-pictures
      - texlive-pstricks
      - texlive-publishers
      - texlive-xetex
      - texlive-luatex
      - texlive-bibtex-extra
      - latexmk
    state: present
  become: true
