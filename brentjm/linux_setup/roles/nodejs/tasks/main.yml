---
# https://docs.volta.sh/guide/getting-started
- name: Install Volta
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL {{ nodejs_volta_download_url }} | bash
    executable: /bin/bash
    creates: ~/.volta/bin/volta

- name: Ensure Volta is in PATH
  ansible.builtin.lineinfile:
    path: ~/.bashrc
    line: 'export PATH=$HOME/.volta/bin:$PATH'
    state: present

- name: Install Node.js using Volta
  ansible.builtin.command:
    cmd: /home/{{ username }}/.volta/bin/volta install node@{{ nodejs_version }}
    creates: ~/.volta/tools/image/node/{{ nodejs_version }}

- name: Install Yarn using Volta
  ansible.builtin.command:
    cmd: /home/{{ username }}/.volta/bin/volta install yarn
    creates: ~/.volta/tools/image/yarn

- name: Install global Node.js tools
  ansible.builtin.import_tasks: global_tools.yml
