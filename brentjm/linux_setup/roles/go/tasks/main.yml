---
# https://go.dev/doc/install — remove any previous /usr/local/go before extracting
- name: Check installed Go version
  ansible.builtin.command: /usr/local/go/bin/go version
  register: go_installed
  changed_when: false
  failed_when: false

- name: Install Go {{ go_version }}
  when: go_version not in go_installed.stdout | default('')
  block:
    - name: Download Go
      ansible.builtin.get_url:
        url: "https://go.dev/dl/{{ go_version }}.linux-amd64.tar.gz"
        dest: /tmp/go.tar.gz
        mode: '0644'
        owner: "{{ username }}"
        group: "{{ username }}"

    - name: Remove previous Go installation
      ansible.builtin.file:
        path: /usr/local/go
        state: absent
      become: true

    - name: Extract Go to /usr/local
      ansible.builtin.unarchive:
        src: /tmp/go.tar.gz
        dest: /usr/local
        remote_src: true
      become: true

- name: Add Go to PATH
  ansible.builtin.lineinfile:
    path: /home/{{ username }}/.bashrc
    line: 'export PATH="$PATH:/usr/local/go/bin"'
