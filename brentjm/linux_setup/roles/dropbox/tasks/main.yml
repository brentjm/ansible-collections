---
- name: Install Dropbox (python3-gpg verifies its download)
  ansible.builtin.apt:
    name:
      - nautilus-dropbox
      - python3-gpg
    state: present
    update_cache: true
  become: true

# Linking the account is manual: dropbox start -i, then open the link it prints.
# Dropbox Basic allows 3 devices; unlink the old machine at dropbox.com > Settings > Security first.
- name: Create autostart directory
  ansible.builtin.file:
    path: "/home/{{ username }}/.config/autostart"
    state: directory
    mode: "0755"

- name: Start Dropbox at login
  ansible.builtin.copy:
    src: /usr/share/applications/dropbox.desktop
    dest: "/home/{{ username }}/.config/autostart/dropbox.desktop"
    remote_src: true
    mode: "0644"
